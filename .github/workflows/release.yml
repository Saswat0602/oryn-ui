name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck root library
        run: npm run typecheck

      - name: Build root library
        run: npm run build

      - name: Run unit and smoke tests
        run: npm test

      - name: Check package exports and fields (publint)
        run: npm run check:pkg

      - name: Check component manifest integrity
        run: npm run check:manifest

      - name: Publish to npm
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view "$PKG_NAME" version 2>/dev/null || echo "")
          if [ "$CURRENT_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "Version $CURRENT_VERSION of $PKG_NAME is already published to npm. Skipping publish."
          else
            echo "Publishing $PKG_NAME@$CURRENT_VERSION to npm..."
            if [ -n "$NODE_AUTH_TOKEN" ]; then
              echo "Publishing via NPM_TOKEN secret..."
              npm publish --access public --provenance
            else
              echo "Publishing via npm Trusted Publisher (OIDC / Provenance)..."
              sed -i '/_authToken/d' ~/.npmrc 2>/dev/null || true
              npm publish --access public --provenance
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
